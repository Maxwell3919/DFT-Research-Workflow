<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Talos Chromium headless capture</title>
    <style>
      body { margin: 0; background: #eef3f5; color: #12232e; font: 20px/1.5 system-ui, sans-serif; }
      main { box-sizing: border-box; width: 100%; min-height: 100vh; padding: 88px 104px; }
      article { max-width: 860px; border-left: 8px solid #147a72; background: white; padding: 42px 48px; box-shadow: 0 8px 28px #12232e22; }
      h1 { margin: 0 0 12px; font-size: 42px; }
      code { background: #e4f1ef; padding: 2px 6px; }
      .boundary { margin-top: 28px; border-top: 1px solid #c7d5d9; padding-top: 20px; color: #41545d; }
    </style>
  </head>
  <body>
    <main>
      <article>
        <p>Talos reproducible browser walkthrough</p>
        <h1>Headless Chromium rendered this local document.</h1>
        <p>The capture command uses <code>--headless=new</code> at 1280 × 720 pixels.</p>
        <p class="boundary">Boundary: this image demonstrates browser rendering only. It is not an X11-window, VESTA, structure-validation, or DFT-execution result.</p>
      </article>
    </main>
  </body>
</html>
