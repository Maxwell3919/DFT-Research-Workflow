<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" role="img" aria-labelledby="title desc"><title id="title">Invented time-dependent response ledger</title><desc id="desc">Two invented metadata cards distinguish compatible response definitions from incompatible observables and geometries.</desc><rect width="720" height="240" fill="white"/><text x="42" y="42" font-family="sans-serif" font-size="20">invented response metadata must match before comparison</text><rect x="70" y="80" width="260" height="105" rx="10" fill="#dbeafe"/><text x="91" y="113" font-family="sans-serif" font-size="16">same kick, dipole, isolated, route</text><text x="91" y="150" font-family="sans-serif" font-size="16">direct comparison permitted</text><rect x="390" y="80" width="260" height="105" rx="10" fill="#fee2e2"/><text x="411" y="113" font-family="sans-serif" font-size="16">different loss observable and cell</text><text x="411" y="150" font-family="sans-serif" font-size="16">direct comparison rejected</text><text x="100" y="220" font-family="sans-serif" font-size="15">matching labels do not prove a time-dependent response</text></svg>
