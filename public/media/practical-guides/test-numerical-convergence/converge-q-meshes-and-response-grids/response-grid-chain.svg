<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Response-grid convergence chain</title>
  <desc id="desc">A four-stage chain from the reference electronic state through response solves and coarse-grid interpolation to a final fine-grid observable, with independent convergence checks at each stage.</desc>
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-family="serif" font-size="22">Each response layer has its own convergence question</text>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#244b6b"/></marker></defs>
  <g font-family="serif" text-anchor="middle">
    <rect x="35" y="125" width="150" height="90" rx="8" fill="#f7f7f7" stroke="#666"/>
    <text x="110" y="155" font-size="16">reference state</text><text x="110" y="180" font-size="14">k mesh and solver</text><text x="110" y="201" font-size="14">must be stable</text>
    <rect x="215" y="125" width="150" height="90" rx="8" fill="#f7f7f7" stroke="#666"/>
    <text x="290" y="155" font-size="16">response solves</text><text x="290" y="180" font-size="14">each q or</text><text x="290" y="201" font-size="14">perturbation converged</text>
    <rect x="395" y="125" width="150" height="90" rx="8" fill="#eaf1f6" stroke="#244b6b" stroke-width="2"/>
    <text x="470" y="155" font-size="16">coarse response grid</text><text x="470" y="180" font-size="14">interpolant and</text><text x="470" y="201" font-size="14">direct-point checks</text>
    <rect x="575" y="125" width="150" height="90" rx="8" fill="#eaf1f6" stroke="#244b6b" stroke-width="2"/>
    <text x="650" y="155" font-size="16">final integration grid</text><text x="650" y="180" font-size="14">reported observable</text><text x="650" y="201" font-size="14">tested separately</text>
  </g>
  <g stroke="#244b6b" stroke-width="2" marker-end="url(#arrow)">
    <path d="M185 170H210"/><path d="M365 170H390"/><path d="M545 170H570"/>
  </g>
  <g font-family="serif" font-size="14" text-anchor="middle">
    <text x="110" y="260">solver residual</text>
    <text x="290" y="260">per-q completion</text>
    <text x="470" y="260">coarse-grid error</text>
    <text x="650" y="260">fine-grid error</text>
  </g>
  <path d="M470 225V295H290V220" fill="none" stroke="#9a6a2a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="380" y="320" text-anchor="middle" font-family="serif" font-size="14">compare selected interpolated points with direct response calculations</text>
</svg>
