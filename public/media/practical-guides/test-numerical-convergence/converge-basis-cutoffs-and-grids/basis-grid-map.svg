<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Coupled basis and real-space grid convergence map</title>
  <desc id="desc">A matrix of basis settings and grid settings with a stable region in the upper-right and arrows showing independent refinement directions.</desc>
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-family="serif" font-size="22">Coupled numerical controls</text>
  <text x="58" y="190" transform="rotate(-90 58 190)" text-anchor="middle" font-family="serif" font-size="17">denser real-space grid</text>
  <text x="400" y="338" text-anchor="middle" font-family="serif" font-size="17">larger basis</text>
  <g stroke="#666" fill="none">
    <path d="M125 290H680"/>
    <path d="M125 290V70"/>
  </g>
  <g font-family="serif" font-size="14" text-anchor="middle">
    <text x="210" y="315">B1</text><text x="330" y="315">B2</text><text x="450" y="315">B3</text><text x="570" y="315">B4</text>
    <text x="100" y="255">G1</text><text x="100" y="185">G2</text><text x="100" y="115">G3</text>
  </g>
  <g stroke="#777" fill="#f7f7f7">
    <rect x="165" y="225" width="90" height="42"/><rect x="285" y="225" width="90" height="42"/><rect x="405" y="225" width="90" height="42"/><rect x="525" y="225" width="90" height="42"/>
    <rect x="165" y="155" width="90" height="42"/><rect x="285" y="155" width="90" height="42"/><rect x="405" y="155" width="90" height="42"/><rect x="525" y="155" width="90" height="42"/>
    <rect x="165" y="85" width="90" height="42"/><rect x="285" y="85" width="90" height="42"/>
  </g>
  <g stroke="#244b6b" fill="#eaf1f6" stroke-width="2">
    <rect x="405" y="85" width="90" height="42"/><rect x="525" y="85" width="90" height="42"/>
  </g>
  <text x="510" y="76" text-anchor="middle" font-family="serif" font-size="15">observable-specific stable region</text>
  <path d="M455 106H565" stroke="#244b6b" stroke-width="2" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#244b6b"/></marker></defs>
</svg>
