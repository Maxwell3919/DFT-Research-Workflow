<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="t d"><title id="t">Actual Silicon QE cutoff matrix</title><desc id="d">Nine actual Quantum ESPRESSO Silicon SCF total energies, plotted relative to the 50 Ry, ten by ten by ten mesh row.</desc><rect width="1000" height="520" fill="#f8f5ee"/><text x="70" y="55" font-family="sans-serif" font-size="27" font-weight="700" fill="#172a3a">Actual Silicon QE cutoff matrix</text><text x="70" y="82" font-family="sans-serif" font-size="15" fill="#52616b">QE 7.5 · COD 9013102 · one fixed teaching structure · 9 electronically converged SCF runs</text><path d="M140 110V410H760" fill="none" stroke="#243746" stroke-width="3"/><text x="440" y="465" text-anchor="middle" font-family="sans-serif" font-size="17">wavefunction cutoff (Ry)</text><text x="38" y="270" transform="rotate(-90 38 270)" text-anchor="middle" font-family="sans-serif" font-size="17">E − E(50 Ry, 10³) (mRy/cell)</text><polyline points="140,343.73640000002524 760,346.74768000003496 1380,349.0084800000227" fill="none" stroke="#2b6f8c" stroke-width="4"/><text x="730" y="160" font-family="sans-serif" font-size="16" fill="#2b6f8c">6</text><polyline points="140,379.13040000002184 760,382.1714400000212 1380,384.41759999999135" fill="none" stroke="#a33d2d" stroke-width="4"/><text x="730" y="190" font-family="sans-serif" font-size="16" fill="#a33d2d">8</text><polyline points="140,384.73008000001073 760,387.7507200000275 1380,390.0" fill="none" stroke="#5c7d46" stroke-width="4"/><text x="730" y="220" font-family="sans-serif" font-size="16" fill="#5c7d46">10</text><text x="790" y="130" font-family="sans-serif" font-size="16" font-weight="700">fixed series</text><text x="500" y="505" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#52616b">Teaching evidence only: no force/stress, band, DOS, or experimental convergence claim.</text></svg>