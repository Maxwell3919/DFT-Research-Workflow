<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Finite-size and vacuum convergence paths</title>
  <desc id="desc">Two convergence curves approach a limit along lateral size and vacuum directions, while a false plateau remains offset from the asymptotic region.</desc>
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-family="serif" font-size="22">Different residual interactions need different refinements</text>
  <g stroke="#666" fill="none"><path d="M100 290H690"/><path d="M100 290V70"/></g>
  <text x="395" y="338" text-anchor="middle" font-family="serif" font-size="17">larger cell or boundary separation</text>
  <text x="42" y="190" transform="rotate(-90 42 190)" text-anchor="middle" font-family="serif" font-size="17">reported observable</text>
  <path d="M125 115C220 165 285 218 390 242C485 265 565 268 660 269" fill="none" stroke="#244b6b" stroke-width="3"/>
  <path d="M125 235C210 228 285 223 365 220C455 216 555 214 660 213" fill="none" stroke="#5b7d4f" stroke-width="3"/>
  <path d="M125 170C230 185 315 188 405 187" fill="none" stroke="#9a6a2a" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="420" y1="269" x2="680" y2="269" stroke="#244b6b" stroke-dasharray="4 4"/>
  <line x1="420" y1="213" x2="680" y2="213" stroke="#5b7d4f" stroke-dasharray="4 4"/>
  <text x="535" y="254" font-family="serif" font-size="14">lateral-size path</text>
  <text x="535" y="200" font-family="serif" font-size="14">vacuum/boundary path</text>
  <text x="285" y="160" font-family="serif" font-size="14">false plateau</text>
  <text x="500" y="105" font-family="serif" font-size="14">test directions independently</text>
</svg>
