<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" role="img" aria-labelledby="title desc">
  <title id="title">Invented optical-spectrum comparison ledger</title>
  <desc id="desc">Two invented metadata cards show that matching response components and normalization are needed before comparing spectra.</desc>
  <rect width="720" height="240" fill="white"/>
  <text x="42" y="42" font-family="sans-serif" font-size="20">invented spectral metadata must match before comparison</text>
  <rect x="70" y="80" width="260" height="105" rx="10" fill="#dbeafe"/>
  <text x="93" y="113" font-family="sans-serif" font-size="17">same: xx, VBM, declared-A, 3D</text>
  <text x="93" y="150" font-family="sans-serif" font-size="17">pointwise comparison permitted</text>
  <rect x="390" y="80" width="260" height="105" rx="10" fill="#fee2e2"/>
  <text x="410" y="113" font-family="sans-serif" font-size="17">different: zz and sheet</text>
  <text x="410" y="150" font-family="sans-serif" font-size="17">direct comparison rejected</text>
  <text x="108" y="220" font-family="sans-serif" font-size="15">matching metadata does not prove a calculated optical response</text>
</svg>
