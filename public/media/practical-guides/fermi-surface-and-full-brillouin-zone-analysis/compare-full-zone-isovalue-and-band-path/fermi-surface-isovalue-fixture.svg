<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img"><title>Invented full-zone isovalue</title><rect width="900" height="420" fill="#f8f5ee"/><text x="45" y="50" font-family="sans-serif" font-size="27" font-weight="700">A path crossing is not a full-zone pocket</text><circle cx="460" cy="220" r="110" fill="none" stroke="#2b6f8c" stroke-width="5"/><line x1="170" y1="350" x2="700" y2="80" stroke="#a33d2d" stroke-width="5"/><text x="80" y="390" font-family="sans-serif" font-size="18">Invented equal-energy contour (blue) and one path (red) · no material calculation</text></svg>