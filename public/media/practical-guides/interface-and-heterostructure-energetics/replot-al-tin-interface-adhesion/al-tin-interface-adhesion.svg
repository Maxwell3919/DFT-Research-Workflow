<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Published Al/TiN Table 2 redraw</title><desc id="d">Seven published PBE Al/TiN contact rows compare magnitude of negative adhesion energy with Al layer removal energy. Colour shows reported transferred Al layers.</desc><rect width="1000" height="560" fill="#f8f5ee"/><text x="55" y="52" font-family="sans-serif" font-size="26" font-weight="700" fill="#172a3a">Al/TiN contact-separation table redraw</text><text x="55" y="82" font-family="sans-serif" font-size="15" fill="#52616b">Feldbauer et al., Table 2 · PBE · eV per interface cell · published data, not rerun here</text><line x1="125" y1="420" x2="850" y2="420" stroke="#243746"/><line x1="125" y1="150" x2="125" y2="420" stroke="#243746"/><line x1="125" y1="420" x2="825" y2="150" stroke="#a33d2d" stroke-dasharray="8 6"/><text x="590" y="170" font-family="sans-serif" font-size="14" fill="#a33d2d">equal magnitudes guide</text><circle cx="319.1" cy="218.9" r="10" fill="#70808a"/><text x="332.1" y="223.9" font-family="sans-serif" font-size="12">1</text><circle cx="790.0" cy="186.0" r="10" fill="#704c8a"/><text x="803.0" y="191.0" font-family="sans-serif" font-size="12">2</text><circle cx="357.3" cy="186.0" r="10" fill="#70808a"/><text x="370.3" y="191.0" font-family="sans-serif" font-size="12">3</text><circle cx="691.4" cy="281.3" r="10" fill="#704c8a"/><text x="704.4" y="286.3" font-family="sans-serif" font-size="12">4</text><circle cx="424.1" cy="281.3" r="10" fill="#d45b45"/><text x="437.1" y="286.3" font-family="sans-serif" font-size="12">5</text><circle cx="729.5" cy="281.3" r="10" fill="#704c8a"/><text x="742.5" y="286.3" font-family="sans-serif" font-size="12">6</text><circle cx="564.1" cy="281.3" r="10" fill="#d45b45"/><text x="577.1" y="286.3" font-family="sans-serif" font-size="12">7</text><text x="490" y="470" text-anchor="middle" font-family="sans-serif" font-size="17">|negative adhesion / interaction energy| (eV per interface cell)</text><text x="30" y="270" transform="rotate(-90 30 270)" text-anchor="middle" font-family="sans-serif" font-size="17">Al-layer removal energy (eV per interface cell)</text><text x="130" y="515" font-family="sans-serif" font-size="14" fill="#52616b">colour: 0 layers</text><circle cx="245" cy="510" r="7" fill="#70808a"/><text x="270" y="515" font-family="sans-serif" font-size="14" fill="#52616b">1 layer</text><circle cx="350" cy="510" r="7" fill="#d45b45"/><text x="375" y="515" font-family="sans-serif" font-size="14" fill="#52616b">2 layers</text><circle cx="455" cy="510" r="7" fill="#704c8a"/><text x="650" y="515" font-family="sans-serif" font-size="13" fill="#52616b">Labels 1–7 follow the committed table snapshot.</text></svg>