<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="t d"><title id="t">Published Al/TiN interface ledger</title><desc id="d">Seven published Al/TiN interface rows compare the magnitude of negative adhesion energy with reported Al-layer removal energy.</desc><rect width="960" height="510" fill="#fffdf8"/><text x="48" y="46" font-family="sans-serif" font-size="24" font-weight="700" fill="#172a3a">Al/TiN interface ledger from published Table 2</text><text x="48" y="72" font-family="sans-serif" font-size="14" fill="#52616b">Adhesion/interaction and removal quantities · eV per interface cell · no rerun</text><line x1="120" y1="390" x2="805" y2="390" stroke="#243746"/><line x1="120" y1="130" x2="120" y2="390" stroke="#243746"/><circle cx="308.5" cy="200.5" r="9" fill="#70808a"/><text x="321.5" y="205.5" font-family="sans-serif" font-size="12">1</text><circle cx="766.0" cy="169.5" r="9" fill="#704c8a"/><text x="779.0" y="174.5" font-family="sans-serif" font-size="12">2</text><circle cx="345.6" cy="169.5" r="9" fill="#70808a"/><text x="358.6" y="174.5" font-family="sans-serif" font-size="12">3</text><circle cx="670.2" cy="259.3" r="9" fill="#704c8a"/><text x="683.2" y="264.3" font-family="sans-serif" font-size="12">4</text><circle cx="410.5" cy="259.3" r="9" fill="#d45b45"/><text x="423.5" y="264.3" font-family="sans-serif" font-size="12">5</text><circle cx="707.3" cy="259.3" r="9" fill="#704c8a"/><text x="720.3" y="264.3" font-family="sans-serif" font-size="12">6</text><circle cx="546.5" cy="259.3" r="9" fill="#d45b45"/><text x="559.5" y="264.3" font-family="sans-serif" font-size="12">7</text><text x="460" y="440" text-anchor="middle" font-family="sans-serif" font-size="15">|negative adhesion / interaction energy|</text><text x="26" y="260" transform="rotate(-90 26 260)" text-anchor="middle" font-family="sans-serif" font-size="15">Al-layer removal energy</text><text x="48" y="482" font-family="sans-serif" font-