<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="t d"><title id="t">Bounded lattice-match fixture</title><desc id="d">Invented square lattice repetitions ranked by symmetric mismatch, with registry still separate.</desc><rect width="1000" height="520" fill="#f8f5ee"/><text x="55" y="55" font-family="sans-serif" font-size="27" font-weight="700" fill="#172a3a">A matched period is only a candidate</text><text x="55" y="90" font-family="sans-serif" font-size="16" fill="#52616b">Invented square lattices: A = 3.00 Å, B = 3.08 Å; diagonal repetitions only</text><line x1="100" y1="390" x2="920" y2="390" stroke="#52616b" stroke-width="2"/><circle cx="150" cy="350.52631578947364" r="18" fill="#2b6f8c"/><text x="150" y="430" text-anchor="middle" font-family="sans-serif" font-size="15">1×A / 1×B</text><circle cx="310" cy="350.52631578947364" r="18" fill="#2b6f8c"/><text x="310" y="430" text-anchor="middle" font-family="sans-serif" font-size="15">2×A / 2×B</text><circle cx="470" cy="350.52631578947364" r="18" fill="#2b6f8c"/><text x="470" y="430" text-anchor="middle" font-family="sans-serif" font-size="15">3×A / 3×B</text><circle cx="630" cy="350.52631578947364" r="18" fill="#2b6f8c"/><text x="630" y="430" text-anchor="middle" font-family="sans-serif" font-size="15">4×A / 4×B</text><text x="150" y="325.52631578947364" text-anchor="middle" font-family="sans-serif" font-size="14">2.63%</text><text x="310" y="325.52631578947364" text-anchor="middle" font-family="sans-serif" font-size="14">2.63%</text><text x="470" y="325.52631578947364" text-anchor="middle" font-family="sans-serif" font-size="14">2.63%</text><text x="630" y="325.52631578947364" text-anchor="middle" font-family="sans-serif" font-size="14">2.63%</text><rect x="100" y="130" width="800" height="120" rx="14" fill="#e7eef1"/><text x="130" y="170" font-family="sans-serif" font-size="19" font-weight="700" fill="#243746">After a cell is retained, registry remains a distinct variable</text><text x="130" y="210" font-family="sans-serif" font-size="17" fill="#52616b">(0,0) · (1/2,0) · (1/2,1/2) are candidate translations, not relaxed minima</text><text x="500" y="485" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#52616b">Deterministic teaching fixture · not a full matcher or a material interface calculation</text></svg>