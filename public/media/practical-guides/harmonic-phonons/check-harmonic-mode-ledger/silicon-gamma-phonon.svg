<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="t d"><title id="t">Silicon Gamma-point phonon modes from a QE 7.5 DFPT run</title><desc id="d">Six real Silicon Gamma-point modes parsed from committed Quantum ESPRESSO output: three 1.216451 inverse-centimeter acoustic diagnostics and three 514.442616 inverse-centimeter optical modes.</desc><rect width="900" height="470" fill="#fffdf8"/><text x="55" y="48" font-size="25" font-family="sans-serif" font-weight="700" fill="#172a3a">Silicon Γ-point modes from QE 7.5 output</text><text x="55" y="76" font-size="15" font-family="sans-serif" fill="#52616b">Single DFPT q point · 8×8×8 SCF · not a dispersion or convergence result</text><line x1="55" y1="365" x2="500" y2="365" stroke="#334155"/><line x1="55" y1="75" x2="55" y2="365" stroke="#334155"/><rect x="65" y="364.4" width="36" height="0.6" fill="#3273a8"/><text x="83" y="392" text-anchor="middle" font-size="13">1</text><rect x="130" y="364.4" width="36" height="0.6" fill="#3273a8"/><text x="148" y="392" text-anchor="middle" font-size="13">2</text><rect x="195" y="364.4" width="36" height="0.6" fill="#3273a8"/><text x="213" y="392" text-anchor="middle" font-size="13">3</text><rect x="260" y="98.6" width="36" height="266.4" fill="#b96d2e"/><text x="278" y="392" text-anchor="middle" font-size="13">4</text><rect x="325" y="98.6" width="36" height="266.4" fill="#b96d2e"/><text x="343" y="392" text-anchor="middle" font-size="13">5</text><rect x="390" y="98.6" width="36" height="266.4" fill="#b96d2e"/><text x="408" y="392" text-anchor="middle" font-size="13">6</text><text x="55" y="425" font-size="14" font-family="sans-serif" fill="#52616b">blue: acoustic diagnostic (1.216451 cm⁻¹) · ochre: optical triplet (514.442616 cm⁻¹)</text></svg>