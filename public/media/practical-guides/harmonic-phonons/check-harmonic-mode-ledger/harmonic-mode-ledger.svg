<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 230" role="img" aria-labelledby="t d"><title id="t">Invented harmonic mode ledger</title><desc id="d">Three invented acoustic zero modes, two positive modes, and one negative-curvature diagnostic are shown.</desc><rect width="390" height="230" fill="white"/><text x="30" y="30" font-size="16">invented ω² eigenvalue ledger</text><path d="M35 150H365" stroke="#334155"/><rect x="55" y="150.0" width="25" height="0.0" fill="#2563eb"/><text x="55" y="190" font-size="11">1</text><rect x="107" y="150.0" width="25" height="0.0" fill="#2563eb"/><text x="107" y="190" font-size="11">2</text><rect x="159" y="150.0" width="25" height="0.0" fill="#2563eb"/><text x="159" y="190" font-size="11">3</text><rect x="211" y="94.0" width="25" height="56.0" fill="#2563eb"/><text x="211" y="190" font-size="11">4</text><rect x="263" y="66.0" width="25" height="84.0" fill="#2563eb"/><text x="263" y="190" font-size="11">5</text><rect x="315" y="150.0" width="25" height="28.0" fill="#dc2626"/><text x="315" y="190" font-size="11">6</text><text x="35" y="215" font-size="11">blue: positive; red: invented negative-curvature diagnostic</text></svg>