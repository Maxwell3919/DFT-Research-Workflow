<text x="225.83" y="473" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#555">0.5</text>
<line x1="363.67" y1="62" x2="363.67" y2="448" stroke="#f0f0f0"/>
<text x="363.67" y="473" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#555">1.0</text>
<line x1="501.50" y1="62" x2="501.50" y2="448" stroke="#f0f0f0"/>
<text x="501.50" y="473" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#555">1.5</text>
<line x1="639.33" y1="62" x2="639.33" y2="448" stroke="#f0f0f0"/>
<text x="639.33" y="473" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#555">2.0</text>
<line x1="777.17" y1="62" x2="777.17" y2="448" stroke="#f0f0f0"/>
