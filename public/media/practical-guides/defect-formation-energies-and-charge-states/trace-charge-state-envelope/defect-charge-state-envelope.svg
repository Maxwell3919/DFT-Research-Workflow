<line x1="88" y1="62" x2="88" y2="448" stroke="#222"/>
<line x1="88.00" y1="403.25" x2="915.00" y2="67.59" stroke="#26547c" stroke-width="2" stroke-dasharray="none"/>
<text x="865.38" y="86.21" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#26547c">q = +2</text>
