<polyline points="88.00,403.25 253.40,336.12 556.63,336.12 915.00,408.84" fill="none" stroke="#111" stroke-width="5"/>
<circle cx="253.40" cy="336.12" r="5" fill="#111"/>
<text x="253.40" y="322.12" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#111">ε(+2/0)</text>
<circle cx="556.63" cy="336.12" r="5" fill="#111"/>
<text x="556.63" y="322.12" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#111">ε(0/−1)</text>
<line x1="764.89" y1="62" x2="764.89" y2="448" stroke="#d17b0f" stroke-width="2" stroke-dasharray="5 4"/>
<text x="756.89" y="84" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a5b08">toy neutrality root: 2.455 eV</text>
<text x="501.50" y="497" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#222">Fermi level above the fixture VBM (eV)</text>
<text x="24" y="255.00" transform="rotate(-90 24 255.00)" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#222">formation energy (eV per defect)</text>
<text x="88" y="516" font-family="Arial,sans-serif" font-size="12" fill="#666">Invented deterministic fixture; line slopes equal q. No DFT, measured gap, or material concentration.</text>
