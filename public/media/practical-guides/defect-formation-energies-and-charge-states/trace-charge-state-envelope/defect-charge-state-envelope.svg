<text x="76" y="453.00" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#555">0</text>
<line x1="88" y1="392.06" x2="915" y2="392.06" stroke="#e8e8e8"/>
<text x="76" y="397.06" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#555">1</text>
<line x1="88" y1="336.12" x2="915" y2="336.12" stroke="#e8e8e8"/>
<text x="76" y="341.12" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#555">2</text>
<line x1="88" y1="280.17" x2="915" y2="280.17" stroke="#e8e8e8"/>
<text x="76" y="285.17" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#555">3</text>
<line x1="88" y1="224.23" x2="915" y2="224.23" stroke="#e8e8e8"/>
<text x="76" y="229.23" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#555">4</text>
<line x1="88" y1="168.29" x2="915" y2="168.29" stroke="#e8e8e8"/>
<text x="76" y="173.29" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#555">5</text>
<line x1="88" y1="112.35" x2="915" y2="112.35" stroke="#e8e8e8"/>
<text x="76" y="117.35" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#555">6</text>
<line x1="88.00" y1="62" x2="88.00" y2="448" stroke="#f0f0f0"/>
<text x="88.00" y="473" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#555">0.0</text>
