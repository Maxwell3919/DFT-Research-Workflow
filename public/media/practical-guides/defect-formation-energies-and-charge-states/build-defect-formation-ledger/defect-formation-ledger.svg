<text x="310" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#333">atomic reservoir</text>
<text x="500" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#333">q(EVBM + EF)</text>
<text x="690" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#333">scheme-total Ecorr</text>
<text x="855" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#333">Ef at EF = 1 eV</text>
<text x="34" y="140" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#26547c">V_B^+2</text>
