<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">Invented reciprocal path ledger</title><desc id="d">An invented Gamma-X-M-Gamma path preserves fractional coordinates, cumulative reciprocal distance, and an explicit energy shift.</desc><rect width="1000" height="500" fill="#f8f5ee"/><text x="55" y="50" font-family="sans-serif" font-size="27" font-weight="700" fill="#172a3a">A path needs coordinates, order, and a reference</text><line x1="100" y1="300" x2="860" y2="300" stroke="#52616b"/><polyline fill="none" stroke="#2b6f8c" stroke-width="4" points="100.0,465.0 322.59884629822386,445.0 545.1976925964477,455.0 860.0,465.0"/><polyline fill="none" stroke="#a33d2d" stroke-width="4" points="100.0,365.0 322.59884629822386,345.0 545.1976925964477,355.0 860.0,365.0"/><line x1="100.0" y1="115" x2="100.0" y2="390" stroke="#9aa8af"/><text x="100.0" y="430" text-anchor="middle" font-family="sans-serif" font-size="18">Γ</text><line x1="322.59884629822386" y1="115" x2="322.59884629822386" y2="390" stroke="#9aa8af"/><text x="322.59884629822386" y="430" text-anchor="middle" font-family="sans-serif" font-size="18">X</text><line x1="545.1976925964477" y1="115" x2="545.1976925964477" y2="390" stroke="#9aa8af"/><text x="545.1976925964477" y="430" text-anchor="middle" font-family="sans-serif" font-size="18">M</text><line x1="860.0" y1="115" x2="860.0" y2="390" stroke="#9aa8af"/><text x="860.0" y="430" text-anchor="middle" font-family="sans-serif" font-size="18">Γ</text><text x="55" y="475" font-family="sans-serif" font-size="14" fill="#52616b">Invented eigenvalues shifted by an invented Fermi reference · no electronic-structure calculation</text></svg>