<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="t d"><title id="t">Path gap versus full-zone gap fixture</title><desc id="d">Invented reciprocal-space field where the full-grid conduction minimum is off the selected path and lowers the gap.</desc><rect width="1000" height="520" fill="#f8f5ee"/><text x="55" y="52" font-family="sans-serif" font-size="27" font-weight="700" fill="#172a3a">A visible path gap need not be the full-zone gap</text><rect x="95" y="105" width="350" height="300" fill="#e7eef1" stroke="#52616b"/><path d="M95 405 L445 405 L445 105" fill="none" stroke="#243746" stroke-width="5"/><circle cx="350" cy="270" r="12" fill="#a33d2d"/><text x="365" y="264" font-family="sans-serif" font-size="15">off-path CBM</text><text x="270" y="445" text-anchor="middle" font-family="sans-serif" font-size="17">invented reciprocal grid</text><rect x="535" y="145" width="350" height="105" rx="12" fill="#fff" stroke="#9aa8af"/><text x="565" y="185" font-family="sans-serif" font-size="19" font-weight="700">path-only separation</text><text x="565" y="225" font-family="sans-serif" font-size="28" fill="#2b6f8c">0.498 eV</text><rect x="535" y="285" width="350" height="105" rx="12" fill="#fff" stroke="#9aa8af"/><text x="565" y="325" font-family="sans-serif" font-size="19" font-weight="700">full-grid separation</text><text x="565" y="365" font-family="sans-serif" font-size="28" fill="#a33d2d">0.305 eV</text><text x="500" y="490" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#52616b">Deterministic invented field · no eigenvalue solve, real Brillouin-zone search, or gap claim</text></svg>