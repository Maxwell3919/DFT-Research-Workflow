<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Balanced reference reactions</title>
  <desc id="desc">Two balanced paths form abstract A2B3 from either elemental A and B2 references or AB and B2 compound reservoirs, producing distinct reaction energies with the same normalization.</desc>
  <rect width="960" height="420" rx="28" fill="#f5f7f2"/>
  <text x="48" y="54" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#17332b">One target, two declared reservoir reactions</text>
  <rect x="52" y="92" width="302" height="112" rx="20" fill="#d8eadf"/>
  <text x="78" y="130" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#17332b">Elemental references</text>
  <text x="78" y="166" font-family="system-ui, sans-serif" font-size="20" fill="#17332b">2 A + 3/2 B₂</text>
  <rect x="52" y="242" width="302" height="112" rx="20" fill="#dfe6f2"/>
  <text x="78" y="280" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#263b5f">Compound reservoirs</text>
  <text x="78" y="316" font-family="system-ui, sans-serif" font-size="20" fill="#263b5f">2 AB + 1/2 B₂</text>
  <path d="M372 148H544" stroke="#55766b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M372 298H544" stroke="#55766b" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="564" y="130" width="166" height="166" rx="28" fill="#17332b"/>
  <text x="612" y="205" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#f7fbf8">A₂B₃</text>
  <text x="593" y="244" font-family="system-ui, sans-serif" font-size="17" fill="#d8eadf">one formula unit</text>
  <path d="M748 212H792" stroke="#55766b" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="808" y="112" width="112" height="202" rx="18" fill="#fff3cf"/>
  <text x="826" y="150" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#5a4411">Report with</text>
  <text x="826" y="180" font-family="system-ui, sans-serif" font-size="16" fill="#5a4411">reaction</text>
  <text x="826" y="210" font-family="system-ui, sans-serif" font-size="16" fill="#5a4411">sign</text>
  <text x="826" y="240" font-family="system-ui, sans-serif" font-size="16" fill="#5a4411">units</text>
  <text x="826" y="270" font-family="system-ui, sans-serif" font-size="16" fill="#5a4411">denominator</text>
  <text x="826" y="300" font-family="system-ui, sans-serif" font-size="16" fill="#5a4411">boundary</text>
  <text x="52" y="394" font-family="system-ui, sans-serif" font-size="17" fill="#5a4411">Negative fixture values do not test omitted competing phases or finite-temperature equilibrium.</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#55766b"/></marker></defs>
</svg>
