<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 225" role="img" aria-labelledby="t d"><title id="t">Invented electron--phonon channel ledger</title><desc id="d">Two invented weighted channel terms and one explicitly excluded row appear in a bookkeeping diagram.</desc><rect width="390" height="225" fill="white"/><text x="28" y="30" font-size="16">invented weighted EPC ledger</text><path d="M40 155H355" stroke="#334155"/><rect x="65" y="119.0" width="44" height="36.0" fill="#7c3aed"/><text x="50" y="180" font-size="10">A</text><rect x="165" y="119.0" width="44" height="36.0" fill="#7c3aed"/><text x="150" y="180" font-size="10">B</text><rect x="265" y="155.0" width="44" height="0.0" fill="#7c3aed"/><text x="250" y="180" font-size="10">excluded</text><text x="28" y="210" font-size="11">This is bookkeeping, not a matrix-element calculation.</text></svg>