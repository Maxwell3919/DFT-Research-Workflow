<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Reusable reference-state lineage</title>
  <desc id="desc">A reference manifest binds structure, method, state, density, wavefunctions, and outputs to compatible downstream calculations.</desc>
  <rect width="960" height="440" fill="#ffffff"/>
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <path d="M210 90 H350"/><path d="M210 180 H350"/><path d="M210 270 H350"/><path d="M210 360 H350"/>
    <path d="M610 220 H750"/>
  </g>
  <g font-family="Georgia, serif" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2">
    <rect x="45" y="55" width="165" height="70" rx="7" fill="#f7f7f7"/>
    <rect x="45" y="145" width="165" height="70" rx="7" fill="#f7f7f7"/>
    <rect x="45" y="235" width="165" height="70" rx="7" fill="#f7f7f7"/>
    <rect x="45" y="325" width="165" height="70" rx="7" fill="#f7f7f7"/>
    <rect x="350" y="95" width="260" height="250" rx="9" fill="#f7f7f7"/>
    <rect x="750" y="145" width="170" height="150" rx="8" fill="#f7f7f7"/>
  </g>
  <g font-family="Georgia, serif" fill="#1a1a1a" text-anchor="middle">
    <text x="127" y="97" font-size="20">Structure</text>
    <text x="127" y="187" font-size="20">Method + state</text>
    <text x="127" y="277" font-size="20">Density + WFC</text>
    <text x="127" y="367" font-size="20">Primary output</text>
    <text x="480" y="140" font-size="24">Reference-state manifest</text>
    <text x="480" y="185" font-size="17">stable identifiers and hashes</text>
    <text x="480" y="220" font-size="17">software and numerical identity</text>
    <text x="480" y="255" font-size="17">parent and supersession links</text>
    <text x="480" y="290" font-size="17">declared compatibility fields</text>
    <text x="835" y="190" font-size="21">Downstream</text>
    <text x="835" y="223" font-size="21">request</text>
    <text x="835" y="260" font-size="16">accept or reject</text>
  </g>
</svg>