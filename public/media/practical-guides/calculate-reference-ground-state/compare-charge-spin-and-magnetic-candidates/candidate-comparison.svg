<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Electronic candidate filtering and bounded ranking</title>
  <desc id="desc">Four candidate states pass through comparability and completion filters; two remain in a bounded energy ranking.</desc>
  <rect width="960" height="440" fill="#ffffff"/>
  <g font-family="Georgia, serif" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2">
    <rect x="40" y="60" width="160" height="65" rx="7" fill="#f7f7f7"/>
    <rect x="40" y="145" width="160" height="65" rx="7" fill="#f7f7f7"/>
    <rect x="40" y="230" width="160" height="65" rx="7" fill="#f7f7f7"/>
    <rect x="40" y="315" width="160" height="65" rx="7" fill="#f7f7f7"/>
    <rect x="325" y="135" width="235" height="170" rx="8" fill="#f7f7f7"/>
    <rect x="690" y="120" width="220" height="200" rx="8" fill="#f7f7f7"/>
    <path d="M200 92 H285 V185 H325" fill="none"/>
    <path d="M200 177 H325" fill="none"/>
    <path d="M200 262 H285 V255 H325" fill="none"/>
    <path d="M200 347 H285 V275 H325" fill="none"/>
    <path d="M560 220 H690" fill="none"/>
  </g>
  <g font-family="Georgia, serif" fill="#1a1a1a" text-anchor="middle">
    <text x="120" y="100" font-size="20">FM-A</text>
    <text x="120" y="185" font-size="20">AFM-B</text>
    <text x="120" y="270" font-size="20">charged-C</text>
    <text x="120" y="355" font-size="18">incomplete NM</text>
    <text x="442" y="175" font-size="22">Eligibility filter</text>
    <text x="442" y="210" font-size="16">same charge · evaluator · normalization</text>
    <text x="442" y="238" font-size="16">completed · state identified</text>
    <text x="442" y="275" font-size="17">retain every exclusion reason</text>
    <text x="800" y="160" font-size="22">Bounded ranking</text>
    <text x="800" y="205" font-size="18">AFM-B</text>
    <text x="800" y="240" font-size="18">FM-A</text>
    <text x="800" y="285" font-size="15">lowest only among accepted</text>
  </g>
</svg>