<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Fresh and restart state lineages</title>
  <desc id="desc">A fresh path and one compatible restart reach the same state, while another restart reaches a distinct state that remains separate.</desc>
  <rect width="960" height="440" fill="#ffffff"/>
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <path d="M145 115 C310 115 330 205 480 205"/>
    <path d="M145 225 C310 225 330 205 480 205"/>
    <path d="M145 335 C330 335 350 315 515 315"/>
    <path d="M480 205 H765"/>
    <path d="M515 315 H765"/>
  </g>
  <g font-family="Georgia, serif" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2">
    <rect x="45" y="75" width="200" height="80" rx="8" fill="#f7f7f7"/>
    <rect x="45" y="185" width="200" height="80" rx="8" fill="#f7f7f7"/>
    <rect x="45" y="295" width="200" height="80" rx="8" fill="#f7f7f7"/>
    <rect x="765" y="165" width="150" height="80" rx="8" fill="#f7f7f7"/>
    <rect x="765" y="275" width="150" height="80" rx="8" fill="#f7f7f7"/>
  </g>
  <g font-family="Georgia, serif" fill="#1a1a1a" text-anchor="middle">
    <text x="145" y="108" font-size="21">Fresh start</text><text x="145" y="136" font-size="16">controlled seed</text>
    <text x="145" y="218" font-size="21">Compatible restart</text><text x="145" y="246" font-size="16">same protocol</text>
    <text x="145" y="328" font-size="21">Alternative restart</text><text x="145" y="356" font-size="16">different seed</text>
    <text x="840" y="198" font-size="22">FM-A</text><text x="840" y="226" font-size="16">same lineage</text>
    <text x="840" y="308" font-size="22">AFM-B</text><text x="840" y="336" font-size="16">separate candidate</text>
  </g>
</svg>