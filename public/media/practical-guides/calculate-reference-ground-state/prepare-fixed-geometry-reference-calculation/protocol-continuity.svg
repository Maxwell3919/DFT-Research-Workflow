<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Reference protocol continuity</title>
  <desc id="desc">Flow from an optimized geometry through method identity checks and declared numerical refinements to a fixed-geometry reference calculation.</desc>
  <rect width="960" height="420" fill="#ffffff"/>
  <g font-family="Georgia, serif" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2">
    <rect x="55" y="135" width="210" height="120" rx="8" fill="#f7f7f7"/>
    <rect x="375" y="85" width="210" height="90" rx="8" fill="#f7f7f7"/>
    <rect x="375" y="225" width="210" height="90" rx="8" fill="#f7f7f7"/>
    <rect x="695" y="135" width="210" height="120" rx="8" fill="#f7f7f7"/>
    <path d="M265 195 H350" fill="none"/>
    <path d="M585 130 H650 V195 H695" fill="none"/>
    <path d="M585 270 H650 V195" fill="none"/>
    <path d="M340 187 l12 8 -12 8" fill="none"/>
    <path d="M683 187 l12 8 -12 8" fill="none"/>
  </g>
  <g font-family="Georgia, serif" fill="#1a1a1a" text-anchor="middle">
    <text x="160" y="170" font-size="22">Accepted optimized</text>
    <text x="160" y="202" font-size="22">geometry</text>
    <text x="160" y="232" font-size="16">checksum · atom order · cell</text>
    <text x="480" y="120" font-size="21">Preserved identity</text>
    <text x="480" y="150" font-size="16">method · potentials · charge · boundary</text>
    <text x="480" y="260" font-size="21">Declared refinements</text>
    <text x="480" y="290" font-size="16">basis · grids · solver controls</text>
    <text x="800" y="170" font-size="22">Fixed-geometry</text>
    <text x="800" y="202" font-size="22">reference protocol</text>
    <text x="800" y="232" font-size="16">new calculation identity</text>
  </g>
</svg>