<svg xmlns="http://www.w3.org/2000/svg" width="660" height="290" viewBox="0 0 660 290" role="img" aria-labelledby="title desc"><title id="title">Invented signed strain--stress ledger</title><desc id="desc">Original plot of invented signed normal strains and stresses with a fitted line and declared cubic stability checks.</desc><rect width="660" height="290" fill="white"/><line x1="72" y1="235" x2="540" y2="235" stroke="#334155"/><line x1="300" y1="35" x2="300" y2="245" stroke="#cbd5e1"/><line x1="72" y1="125" x2="540" y2="125" stroke="#cbd5e1"/><line x1="95" y1="218" x2="505" y2="2" stroke="#64748b" stroke-width="3"/><circle cx="110" cy="210" r="7" fill="#2563eb"/><circle cx="205" cy="160" r="7" fill="#2563eb"/><circle cx="395" cy="60" r="7" fill="#2563eb"/><circle cx="490" cy="10" r="7" fill="#2563eb"/><text x="78" y="32" font-family="sans-serif" font-size="17" fill="#0f172a">invented stress versus signed normal strain</text><text x="410" y="95" font-family="sans-serif" font-size="14" fill="#334155">fitted slope: 200</text><rect x="410" y="145" width="205" height="84" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="425" y="173" font-family="sans-serif" font-size="14" fill="#0f172a">invented cubic checks</text><text x="425" y="198" font-family="sans-serif" font-size="13" fill="#334155">C11 − C12 &gt; 0</text><text x="425" y="218" font-family="sans-serif" font-size="13" fill="#334155">C11 + 2C12 &gt; 0; C44 &gt; 0</text><text x="78" y="270" font-family="sans-serif" font-size="13" fill="#334155">illustrative ledger only; no material stress tensor is represented</text></svg>