<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Two-dimensional monolayer periodicity</title>
  <desc id="desc">A hexagonal atomic sheet lies in the middle of a tall cell, with periodic arrows in plane and a nonperiodic vacuum direction out of plane.</desc>
  <rect width="960" height="520" fill="#ffffff"/>
  <rect x="130" y="45" width="700" height="410" fill="none" stroke="#455a64" stroke-width="4"/>
  <g stroke="#90a4ae" stroke-width="3" fill="none">
    <path d="M280 260 L350 220 L420 260 L350 300 Z"/>
    <path d="M420 260 L490 220 L560 260 L490 300 Z"/>
    <path d="M560 260 L630 220 L700 260 L630 300 Z"/>
    <path d="M350 220 L420 180 L490 220"/>
    <path d="M490 220 L560 180 L630 220"/>
  </g>
  <g fill="#123f70">
    <circle cx="280" cy="260" r="13"/><circle cx="350" cy="220" r="13"/><circle cx="420" cy="260" r="13"/><circle cx="350" cy="300" r="13"/>
    <circle cx="490" cy="220" r="13"/><circle cx="560" cy="260" r="13"/><circle cx="490" cy="300" r="13"/>
    <circle cx="630" cy="220" r="13"/><circle cx="700" cy="260" r="13"/><circle cx="630" cy="300" r="13"/>
    <circle cx="420" cy="180" r="13"/><circle cx="560" cy="180" r="13"/>
  </g>
  <g fill="#607d8b">
    <circle cx="350" cy="260" r="9"/><circle cx="490" cy="260" r="9"/><circle cx="630" cy="260" r="9"/>
  </g>
  <g fill="none" stroke="#123f70" stroke-width="4">
    <path d="M210 390 H750"/><path d="M230 377 L210 390 L230 403"/><path d="M730 377 L750 390 L730 403"/>
    <path d="M865 110 V405" stroke-dasharray="10 8"/>
    <path d="M853 125 L865 110 L877 125"/><path d="M853 390 L865 405 L877 390"/>
  </g>
  <g fill="#1a1a1a" font-family="Georgia, serif" text-anchor="middle">
    <text x="480" y="425" font-size="25">periodic in plane</text>
    <text x="480" y="105" font-size="25">vacuum belongs to the model and later convergence tests</text>
    <text x="895" y="260" transform="rotate(90 895 260)" font-size="22">nonperiodic out of plane</text>
  </g>
</svg>
