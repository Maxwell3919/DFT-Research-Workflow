<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
  <title id="title">Structure transformation lineage</title>
  <desc id="desc">A parent structure branches to a supercell representation, a strained model, and a species-substituted model.</desc>
  <rect width="1040" height="520" fill="#ffffff"/>
  <g fill="#f7f8f9" stroke="#455a64" stroke-width="3">
    <rect x="385" y="55" width="270" height="92" rx="6"/>
    <rect x="55" y="345" width="250" height="92" rx="6"/>
    <rect x="395" y="345" width="250" height="92" rx="6"/>
    <rect x="735" y="345" width="250" height="92" rx="6"/>
  </g>
  <g fill="none" stroke="#123f70" stroke-width="4">
    <path d="M520 147 V235 H180 V345"/>
    <path d="M520 235 V345"/>
    <path d="M520 235 H860 V345"/>
    <path d="M168 329 L180 345 L192 329"/>
    <path d="M508 329 L520 345 L532 329"/>
    <path d="M848 329 L860 345 L872 329"/>
  </g>
  <g fill="#1a1a1a" font-family="Georgia, serif" text-anchor="middle">
    <text x="520" y="110" font-size="30">parent structure</text>
    <text x="180" y="385" font-size="27">integer supercell</text>
    <text x="180" y="416" font-size="19">representation may be equivalent</text>
    <text x="520" y="385" font-size="27">deformed cell</text>
    <text x="520" y="416" font-size="19">physical model changed</text>
    <text x="860" y="385" font-size="27">species substitution</text>
    <text x="860" y="416" font-size="19">composition changed</text>
    <text x="520" y="210" font-size="22">record transformation type and parameters</text>
  </g>
</svg>
