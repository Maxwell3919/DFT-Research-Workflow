<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Primitive cell repeated into a supercell</title>
  <desc id="desc">A single square primitive cell is connected by an arrow to a two by two repeated cell.</desc>
  <rect width="960" height="420" fill="#ffffff"/>
  <g fill="none" stroke="#455a64" stroke-width="4">
    <rect x="90" y="110" width="180" height="180"/>
    <rect x="610" y="70" width="240" height="240"/>
    <line x1="730" y1="70" x2="730" y2="310"/>
    <line x1="610" y1="190" x2="850" y2="190"/>
    <path d="M330 200 H545"/>
    <path d="M530 184 L552 200 L530 216"/>
  </g>
  <g fill="#123f70">
    <circle cx="90" cy="110" r="11"/><circle cx="270" cy="110" r="11"/>
    <circle cx="90" cy="290" r="11"/><circle cx="270" cy="290" r="11"/>
    <circle cx="180" cy="200" r="11"/>
    <circle cx="610" cy="70" r="10"/><circle cx="730" cy="70" r="10"/><circle cx="850" cy="70" r="10"/>
    <circle cx="610" cy="190" r="10"/><circle cx="730" cy="190" r="10"/><circle cx="850" cy="190" r="10"/>
    <circle cx="610" cy="310" r="10"/><circle cx="730" cy="310" r="10"/><circle cx="850" cy="310" r="10"/>
    <circle cx="670" cy="130" r="10"/><circle cx="790" cy="130" r="10"/>
    <circle cx="670" cy="250" r="10"/><circle cx="790" cy="250" r="10"/>
  </g>
  <g fill="#1a1a1a" font-family="Georgia, serif" text-anchor="middle">
    <text x="180" y="350" font-size="28">primitive representation</text>
    <text x="730" y="360" font-size="28">2 × 2 repeated representation</text>
    <text x="440" y="170" font-size="24">integer repeat</text>
  </g>
</svg>
