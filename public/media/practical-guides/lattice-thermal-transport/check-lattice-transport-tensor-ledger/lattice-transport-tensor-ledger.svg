<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 225" role="img" aria-labelledby="t d"><title id="t">Invented lattice transport ledger</title><desc id="d">Two invented modal contributions and one explicitly excluded boundary row appear in an invented transport tensor ledger.</desc><rect width="390" height="225" fill="white"/><text x="28" y="30" font-size="16">invented modal κ ledger</text><path d="M40 155H355" stroke="#334155"/><rect x="65" y="65.0" width="42" height="90.0" fill="#2563eb"/><text x="55" y="180" font-size="10">acoustic</text><rect x="160" y="149.0" width="42" height="6.0" fill="#2563eb"/><text x="150" y="180" font-size="10">optical</text><rect x="255" y="155.0" width="42" height="0.0" fill="#2563eb"/><text x="245" y="180" font-size="10">excluded</text><text x="28" y="210" font-size="11">Only declared particle-like terms enter this invented sum.</text></svg>