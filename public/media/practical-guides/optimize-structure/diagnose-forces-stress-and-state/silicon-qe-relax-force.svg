<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">Actual Silicon fixed-cell force history</title>
<desc id="desc">Maximum absolute free Cartesian force component and the separately reported Quantum ESPRESSO aggregate Total force for five ionic evaluations.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="70" y="42" font-family="sans-serif" font-size="25" font-weight="700">Silicon fixed-cell relaxation: inspect components, not one stop line</text>
<text x="70" y="70" font-family="sans-serif" font-size="15" fill="#52616b">QE 7.5 · hash-bound output · all atomic components active · cell fixed</text>
<line x1="120" y1="105.0" x2="900" y2="105.0" stroke="#d8d2c8"/><text x="106" y="110.0" text-anchor="end" font-family="sans-serif" font-size="14">10^-1</text>
<line x1="120" y1="183.8" x2="900" y2="183.8" stroke="#d8d2c8"/><text x="106" y="188.8" text-anchor="end" font-family="sans-serif" font-size="14">10^-2</text>
<line x1="120" y1="262.5" x2="900" y2="262.5" stroke="#d8d2c8"/><text x="106" y="267.5" text-anchor="end" font-family="sans-serif" font-size="14">10^-3</text>
<line x1="120" y1="341.2" x2="900" y2="341.2" stroke="#d8d2c8"/><text x="106" y="346.2" text-anchor="end" font-family="sans-serif" font-size="14">10^-4</text>
<line x1="120" y1="420.0" x2="900" y2="420.0" stroke="#d8d2c8"/><text x="106" y="425.0" text-anchor="end" font-family="sans-serif" font-size="14">10^-5</text>
<line x1="120" y1="105" x2="120" y2="420" stroke="#243746" stroke-width="2"/>
<line x1="120" y1="420" x2="900" y2="420" stroke="#243746" stroke-width="2"/>
<line x1="120" y1="341.2" x2="900" y2="341.2" stroke="#7b2f24" stroke-width="2" stroke-dasharray="7 5"/>
<text x="900" y="333.2" text-anchor="end" font-family="sans-serif" font-size="13" fill="#7b2f24">declared component threshold 1e-4 Ry/bohr</text>
<polyline points="120.0,147.5 315.0,176.2 510.0,267.1 705.0,295.8 900.0,403.7" fill="none" stroke="#a33d2d" stroke-width="3"/>
<polyline points="120.0,123.6 315.0,152.4 510.0,254.6 705.0,283.6 900.0,376.2" fill="none" stroke="#2b6f8c" stroke-width="3"/>
<circle cx="120.0" cy="147.5" r="6" fill="#a33d2d"/><circle cx="120.0" cy="123.6" r="5" fill="#2b6f8c"/><text x="120.0" y="447" text-anchor="middle" font-family="sans-serif" font-size="14">1</text>
<circle cx="315.0" cy="176.2" r="6" fill="#a33d2d"/><circle cx="315.0" cy="152.4" r="5" fill="#2b6f8c"/><text x="315.0" y="447" text-anchor="middle" font-family="sans-serif" font-size="14">2</text>
<circle cx="510.0" cy="267.1" r="6" fill="#a33d2d"/><circle cx="510.0" cy="254.6" r="5" fill="#2b6f8c"/><text x="510.0" y="447" text-anchor="middle" font-family="sans-serif" font-size="14">3</text>
<circle cx="705.0" cy="295.8" r="6" fill="#a33d2d"/><circle cx="705.0" cy="283.6" r="5" fill="#2b6f8c"/><text x="705.0" y="447" text-anchor="middle" font-family="sans-serif" font-size="14">4</text>
<circle cx="900.0" cy="403.7" r="6" fill="#a33d2d"/><circle cx="900.0" cy="376.2" r="5" fill="#2b6f8c"/><text x="900.0" y="447" text-anchor="middle" font-family="sans-serif" font-size="14">5</text>
<line x1="650" y1="91" x2="688" y2="91" stroke="#a33d2d" stroke-width="3"/><text x="697" y="96" font-family="sans-serif" font-size="13">max |free Cartesian component|</text>
<line x1="650" y1="113" x2="688" y2="113" stroke="#2b6f8c" stroke-width="3"/><text x="697" y="118" font-family="sans-serif" font-size="13">QE printed Total force</text>
<text x="510" y="480" text-anchor="middle" font-family="sans-serif" font-size="16">ionic evaluation</text>
<text x="32" y="270" transform="rotate(-90 32 270)" text-anchor="middle" font-family="sans-serif" font-size="16">force (Ry/bohr, log scale)</text>
<text x="500" y="520" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#52616b">Component gate passes only for this fixed-cell run; no stress, cell, global-minimum, or material conclusion.</text>
</svg>
