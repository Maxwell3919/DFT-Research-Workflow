<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="t d"><title id="t">Actual Silicon QE relaxation force trace</title><desc id="d">Total force from five ionic steps of a bounded Quantum ESPRESSO Silicon BFGS relaxation.</desc><rect width="1000" height="520" fill="#f8f5ee"/><text x="70" y="55" font-family="sans-serif" font-size="27" font-weight="700" fill="#172a3a">Actual Silicon QE fixed-cell relaxation</text><text x="70" y="82" font-family="sans-serif" font-size="15" fill="#52616b">QE 7.5 · COD 9013102 · displaced two-site cell · all atoms active, cell fixed</text><path d="M120 100V410H850" fill="none" stroke="#243746" stroke-width="3"/><polyline points="160,87.99439999999998 305,259.7972 450,383.448 595,387.192 740,389.8128" fill="none" stroke="#2b6f8c" stroke-width="5"/><circle cx="160" cy="87.99439999999998" r="7" fill="#a33d2d"/><circle cx="305" cy="259.7972" r="7" fill="#a33d2d"/><circle cx="450" cy="383.448" r="7" fill="#a33d2d"/><circle cx="595" cy="387.192" r="7" fill="#a33d2d"/><circle cx="740" cy="389.8128" r="7" fill="#a33d2d"/><text x="500" y="465" text-anchor="middle" font-family="sans-serif" font-size="17">ionic step</text><text x="38" y="270" transform="rotate(-90 38 270)" text-anchor="middle" font-family="sans-serif" font-size="17">total force (Ry/bohr)</text><text x="500" y="505" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#52616b">Stored-output reconstruction only; no cell, force-threshold, or global-minimum conclusion.</text></svg>