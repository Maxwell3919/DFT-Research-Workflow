<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Coupled diagnostics along an optimization history</title>
  <desc id="desc">Conceptual force, stress, and state traces show a clean converging branch and a separate branch with an electronic-state switch.</desc>
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="46" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#1a1a1a">Read the whole optimization history</text>
  <g stroke="#1a1a1a" stroke-width="2">
    <line x1="95" y1="405" x2="820" y2="405"/>
    <line x1="95" y1="100" x2="95" y2="405"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#1a1a1a">
    <text x="455" y="452" text-anchor="middle">accepted structural step</text>
    <text x="35" y="245" text-anchor="middle" transform="rotate(-90 35 245)">diagnostic magnitude</text>
  </g>
  <polyline points="110,130 240,190 370,255 500,315 630,360 760,382" fill="none" stroke="#123f70" stroke-width="5"/>
  <polyline points="110,170 240,220 370,280 500,330 630,370 760,390" fill="none" stroke="#6a7f35" stroke-width="5"/>
  <polyline points="110,210 240,245 370,290 500,305 630,340 760,365" fill="none" stroke="#8a5a00" stroke-width="4" stroke-dasharray="10 7"/>
  <g font-family="Arial, sans-serif" font-size="17">
    <text x="700" y="345" fill="#123f70">max force</text>
    <text x="700" y="405" fill="#6a7f35">stress</text>
    <text x="700" y="320" fill="#8a5a00">displacement</text>
  </g>
  <line x1="440" y1="105" x2="440" y2="405" stroke="#a12a2a" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="455" y="125" font-family="Arial, sans-serif" font-size="17" fill="#a12a2a">state switch</text>
  <g fill="#123f70">
    <circle cx="110" cy="130" r="6"/><circle cx="240" cy="190" r="6"/><circle cx="370" cy="255" r="6"/><circle cx="500" cy="315" r="6"/><circle cx="630" cy="360" r="6"/><circle cx="760" cy="382" r="6"/>
  </g>
  <rect x="110" y="70" width="255" height="44" rx="6" fill="#eaf2f8" stroke="#123f70"/>
  <text x="237" y="98" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#123f70">continuous state branch</text>
  <rect x="500" y="70" width="255" height="44" rx="6" fill="#fbe9e9" stroke="#a12a2a"/>
  <text x="627" y="98" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#8a1f1f">split before interpretation</text>
</svg>
