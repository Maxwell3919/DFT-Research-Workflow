<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Multiple starts reaching different local minima</title>
  <desc id="desc">A conceptual double-well energy landscape shows four starting points descending into two retained local minima, one lower than the other.</desc>
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#1a1a1a">One local relaxation explores one basin</text>
  <g stroke="#1a1a1a" stroke-width="2">
    <line x1="80" y1="420" x2="830" y2="420"/>
    <line x1="80" y1="90" x2="80" y2="420"/>
  </g>
  <text x="450" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#1a1a1a">configuration coordinate</text>
  <text x="30" y="255" text-anchor="middle" transform="rotate(-90 30 255)" font-family="Arial, sans-serif" font-size="17" fill="#1a1a1a">energy</text>
  <path d="M95 130 C170 110 220 350 320 360 C410 370 420 155 505 155 C590 155 610 330 710 335 C780 338 805 205 825 145" fill="none" stroke="#123f70" stroke-width="5"/>
  <circle cx="315" cy="360" r="9" fill="#326b3f"/>
  <circle cx="710" cy="335" r="9" fill="#8a5a00"/>
  <g fill="#a12a2a" stroke="#a12a2a" stroke-width="2">
    <circle cx="145" cy="165" r="7"/><circle cx="255" cy="230" r="7"/><circle cx="570" cy="225" r="7"/><circle cx="790" cy="190" r="7"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555555"/>
    </marker>
  </defs>
  <g stroke="#555555" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M150 175 Q210 260 300 345"/>
    <path d="M260 240 Q285 285 310 345"/>
    <path d="M575 235 Q625 280 695 325"/>
    <path d="M785 200 Q755 255 720 325"/>
  </g>
  <g font-family="Georgia, serif" font-size="18">
    <text x="315" y="395" text-anchor="middle" fill="#326b3f">minimum A</text>
    <text x="710" y="372" text-anchor="middle" fill="#6a4300">minimum B</text>
    <text x="450" y="100" text-anchor="middle" fill="#a12a2a">distinct starting candidates</text>
  </g>
  <text x="450" y="442" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1a1a1a">Retain both basins; ranking is a separate comparable calculation.</text>
</svg>
