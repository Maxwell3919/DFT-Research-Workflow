<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 225" role="img" aria-labelledby="t d"><title id="t">Invented superconductivity moment ledger</title><desc id="d">Two invented weighted logarithmic terms and one explicitly excluded row appear in a spectral-moment bookkeeping diagram.</desc><rect width="390" height="225" fill="white"/><text x="28" y="30" font-size="16">invented spectral moment ledger</text><path d="M40 155H355" stroke="#334155"/><rect x="65" y="139.0" width="44" height="16.0" fill="#b45309"/><text x="50" y="180" font-size="10">low</text><rect x="165" y="107.0" width="44" height="48.0" fill="#b45309"/><text x="150" y="180" font-size="10">high</text><rect x="265" y="155.0" width="44" height="0.0" fill="#b45309"/><text x="250" y="180" font-size="10">excluded</text><text x="28" y="210" font-size="11">No gap equation or transition temperature is solved.</text></svg>