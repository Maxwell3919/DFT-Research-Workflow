<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 225" role="img" aria-labelledby="t d"><title id="t">Invented anharmonic linewidth ledger</title><desc id="d">Two invented on-shell channel contributions and one excluded off-shell channel form an invented linewidth ledger.</desc><rect width="390" height="225" fill="white"/><text x="28" y="30" font-size="16">invented three-phonon ledger</text><path d="M40 155H355" stroke="#334155"/><rect x="65" y="119.0" width="46" height="36.0" fill="#2563eb"/><text x="65" y="180" font-size="11">decay</text><rect x="165" y="119.0" width="46" height="36.0" fill="#2563eb"/><text x="165" y="180" font-size="11">absorb</text><rect x="265" y="155.0" width="46" height="0.0" fill="#2563eb"/><text x="265" y="180" font-size="11">off-shell</text><text x="28" y="210" font-size="11">Only declared on-shell weights enter this invented arithmetic.</text></svg>