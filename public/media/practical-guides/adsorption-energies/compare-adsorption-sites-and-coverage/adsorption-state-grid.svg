<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Synthetic adsorption site and coverage comparison</title><desc id="desc">Conceptual energy curves for top, bridge, and hollow starting sites across three coverages, plus a fixed-coverage finite-cell difference.</desc><rect width="1000" height="560" fill="#f8f5ee"/><text x="55" y="48" font-family="sans-serif" font-size="26" font-weight="700" fill="#172a3a">Compare only matched adsorption states</text><line x1="95" y1="90" x2="95" y2="430" stroke="#263746"/><line x1="95" y1="430" x2="855" y2="430" stroke="#263746"/><line x1="139.7" y1="430" x2="139.7" y2="436" stroke="#263746"/><text x="139.7" y="457" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#52616b">0.25</text><line x1="363.2" y1="430" x2="363.2" y2="436" stroke="#263746"/><text x="363.2" y="457" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#52616b">0.50</text><line x1="810.3" y1="430" x2="810.3" y2="436" stroke="#263746"/><text x="810.3" y="457" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#52616b">1.00</text><line x1="89" y1="381.4" x2="95" y2="381.4" stroke="#263746"/><line x1="95" y1="381.4" x2="855" y2="381.4" stroke="#d9dfe2"/><text x="83" y="386.4" text-anchor="end" font-family="sans-serif" font-size="13" fill="#52616b">-0.8</text><line x1="89" y1="284.3" x2="95" y2="284.3" stroke="#263746"/><line x1="95" y1="284.3" x2="855" y2="284.3" stroke="#d9dfe2"/><text x="83" y="289.3" text-anchor="end" font-family="sans-serif" font-size="13" fill="#52616b">-0.6</text><line x1="89" y1="187.1" x2="95" y2="187.1" stroke="#263746"/><line x1="95" y1="187.1" x2="855" y2="187.1" stroke="#d9dfe2"/><text x="83" y="192.1" text-anchor="end" font-family="sans-serif" font-size="13" fill="#52616b">-0.4</text><line x1="89" y1="90.0" x2="95" y2="90.0" stroke="#263746"/><line x1="95" y1="90.0" x2="855" y2="90.0" stroke="#d