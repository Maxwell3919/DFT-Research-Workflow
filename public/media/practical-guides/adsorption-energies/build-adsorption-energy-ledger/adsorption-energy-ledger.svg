<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Adsorption-energy ledger from compatible terms</title><desc id="desc">Conceptual ledger showing a molecular adsorption subtraction, average versus differential coverage energies, and additive free-energy terms made from invented values.</desc><rect width="1000" height="560" fill="#f8f5ee"/><text x="55" y="48" font-family="sans-serif" font-size="26" font-weight="700" fill="#172a3a">One reaction, one sign convention, every term visible</text><rect x="55" y="85" width="890" height="120" rx="14" fill="#e7eef1" stroke="#78909c"/><text x="80" y="118" font-family="sans-serif" font-size="18" font-weight="700" fill="#243746">CO(g) + * → CO*</text><text x="80" y="153" font-family="monospace" font-size="18" fill="#243746">-514.800 - (-500.000) - (-14.000)</text><text x="80" y="187" font-family="sans-serif" font-size="20" fill="#a33d2d">E_ads = -0.80 eV per CO</text><text x="690" y="153" font-family="sans-serif" font-size="15" fill="#52616b">products − reactants</text><text x="690" y="181" font-family="sans-serif" font-size="15" fill="#52616b">negative = favourable here</text><rect x="55" y="235" width="420" height="155" rx="14" fill="#fff" stroke="#9aa8af"/><text x="80" y="270" font-family="sans-serif" font-size="18" font-weight="700" fill="#243746">Coverage changes the question</text><text x="80" y="310" font-family="sans-serif" font-size="18" fill="#2b6f8c">average at N=2: -0.60 eV / CO</text><text x="80" y="346" font-family="sans-serif" font-size="18" fill="#d45b45">second addition: -0.40 eV</text><text x="80" y="374" font-family="sans-serif" font-size="14" fill="#52616b">same invented totals, different normalization</text><rect x="525" y="235" width="420" height="155" rx="14" fill="#fff" stroke="#9aa8af"/><text x="550" y="270" font-family="sans-serif" font-size="18" font-weight="700" fill="#243746">Static energy → illustrative ΔG</text><text x="550" y="307" font-family="sans-serif" font-size="16" fill="#52616b">ΔE + ZPE + thermal − TΔS + environment</text><text x="550" y="348" font-family="sans-serif" font-size="24" fill="#704c8a">-0.19 eV per CO</text><text x="550" y="376" font-family="sans-serif" font-size="14" fill="#52616b">all correction terms are invented teaching values</text><path d="M500 416 L500 468" stroke="#70808a" stroke-width="3" marker-end="url(#arrow)"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#70808a"/></marker></defs><text x="500" y="505" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#243746">Comparable terms support a conditional result</text><text x="500" y="535" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#52616b">Deterministic fixture · no DFT, adsorption experiment, or thermodynamic sampling</text></svg>