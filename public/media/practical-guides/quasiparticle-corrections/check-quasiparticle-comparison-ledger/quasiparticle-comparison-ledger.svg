<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" role="img" aria-labelledby="title desc"><title id="title">Invented quasiparticle comparison ledger</title><desc id="desc">Invented metadata cards show matching and incompatible GW comparison declarations.</desc><rect width="720" height="240" fill="white"/><text x="42" y="42" font-family="sans-serif" font-size="20">invented QP metadata must match before comparison</text><rect x="70" y="80" width="260" height="105" rx="10" fill="#dbeafe"/><text x="92" y="115" font-family="sans-serif" font-size="16">same start, scheme, boundary, response</text><text x="92" y="151" font-family="sans-serif" font-size="16">comparison permitted</text><rect x="390" y="80" width="260" height="105" rx="10" fill="#fee2e2"/><text x="410" y="115" font-family="sans-serif" font-size="16">different start and boundary</text><text x="410" y="151" font-family="sans-serif" font-size="16">comparison rejected</text><text x="120" y="220" font-family="sans-serif" font-size="15">matching labels do not prove a GW quasiparticle result</text></svg>
