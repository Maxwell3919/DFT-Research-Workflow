<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" role="img" aria-labelledby="title desc"><title id="title">Invented anisotropy and exchange ledger</title><desc id="desc">Original diagram of invented directional energy differences and a two-site exchange sign convention.</desc><rect width="680" height="290" fill="white"/><text x="48" y="35" font-family="sans-serif" font-size="18" fill="#0f172a">invented directional differences relative to c axis</text><line x1="72" y1="185" x2="580" y2="185" stroke="#334155"/><rect x="125" y="167.0" width="78" height="18.0" fill="#2563eb"/><text x="125" y="208" font-family="sans-serif" font-size="14" fill="#334155">c axis</text><text x="125" y="157.0" font-family="sans-serif" font-size="13" fill="#334155">0.000</text><rect x="285" y="166.9" width="78" height="18.1" fill="#2563eb"/><text x="285" y="208" font-family="sans-serif" font-size="14" fill="#334155">a axis</text><text x="285" y="156.9" font-family="sans-serif" font-size="13" fill="#334155">0.008</text><rect x="445" y="166.9" width="78" height="18.1" fill="#2563eb"/><text x="445" y="208" font-family="sans-serif" font-size="14" fill="#334155">b axis</text><text x="445" y="156.9" font-family="sans-serif" font-size="13" fill="#334155">0.005</text><rect x="410" y="72" width="228" height="106" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="427" y="103" font-family="sans-serif" font-size="15" fill="#0f172a">H = -J e₁·e₂</text><text x="427" y="130" font-family="sans-serif" font-size="14" fill="#334155">parallel: -J</text><text x="427" y="153" font-family="sans-serif" font-size="14" fill="#334155">antiparallel: +J</text><text x="48" y="256" font-family="sans-serif" font-size="14" fill="#334155">invented values; directional ranking and fitted J are conditional model quantities</text></svg>