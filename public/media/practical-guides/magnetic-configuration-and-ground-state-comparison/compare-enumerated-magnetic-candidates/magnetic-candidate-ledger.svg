<svg xmlns="http://www.w3.org/2000/svg" width="650" height="280" viewBox="0 0 650 280" role="img" aria-labelledby="title desc"><title id="title">Invented magnetic candidate ledger</title><desc id="desc">An original diagram comparing invented compatible FM, AFM, and nonmagnetic candidate energies and moment patterns.</desc><rect width="650" height="280" fill="white"/><line x1="65" y1="215" x2="610" y2="215" stroke="#334155"/><line x1="65" y1="40" x2="65" y2="215" stroke="#334155"/><text x="72" y="30" font-family="sans-serif" font-size="16" fill="#334155">invented energy per formula unit</text><circle cx="120" cy="60.0" r="9" fill="#dc2626"/><text x="76" y="238" font-family="sans-serif" font-size="13" fill="#334155">FM seed 1</text><circle cx="265" cy="150.0" r="9" fill="#2563eb"/><text x="221" y="238" font-family="sans-serif" font-size="13" fill="#334155">AFM seed 1</text><circle cx="410" cy="150.0" r="9" fill="#2563eb"/><text x="366" y="238" font-family="sans-serif" font-size="13" fill="#334155">AFM seed 2</text><circle cx="555" cy="-210.0" r="9" fill="#64748b"/><text x="511" y="238" font-family="sans-serif" font-size="13" fill="#334155">nonmagnetic seed</text><text x="76" y="62" font-family="sans-serif" font-size="15" fill="#2563eb">blue: compensated local AFM moments, zero net moment</text><text x="76" y="84" font-family="sans-serif" font-size="15" fill="#334155">lowest listed candidate only; candidate set remains bounded</text></svg>