<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 240" role="img" aria-labelledby="t d"><title id="t">Invented piezoelectric ledger</title><desc id="d">Invented clamped and internal contributions form three explicitly labelled piezoelectric components.</desc><rect width="430" height="240" fill="white"/><text x="36" y="30" font-size="17">invented e = e clamped + e internal</text><path d="M45 175H395" stroke="#334155"/><rect x="70" y="85.0" width="26" height="27.0" fill="#2563eb"/><rect x="70" y="85.0" width="26" height="63.0" fill="#f97316"/><text x="66" y="200" font-size="13">e31</text><text x="65" y="75.0" font-size="11">0.60</text><rect x="180" y="169.0" width="26" height="-7.5" fill="#2563eb"/><rect x="180" y="169.0" width="26" height="13.5" fill="#f97316"/><text x="176" y="200" font-size="13">e32</text><text x="175" y="159.0" font-size="11">0.04</text><rect x="290" y="182.5" width="26" height="16.5" fill="#2563eb"/><rect x="290" y="182.5" width="26" height="-24.0" fill="#f97316"/><text x="286" y="200" font-size="13">e33</text><text x="285" y="172.5" font-size="11">-0.05</text><text x="45" y="224" font-size="12">blue: clamped; orange: internal; no material response represented</text></svg>