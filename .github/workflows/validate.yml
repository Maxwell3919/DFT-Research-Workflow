name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  reviewed-source-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Locate Chrome for controlled browser fallback
        shell: bash
        run: |
          for browser in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$browser" >/dev/null 2>&1; then
              echo "CHROME_BIN=$(command -v "$browser")" >> "$GITHUB_ENV"
              "$browser" --version
              exit 0
            fi
          done
          echo "No supported Chrome or Chromium binary is available" >&2
          exit 1
      - name: Audit every reviewed external source
        run: npm run audit:reviewed-links
        env:
          LINK_AUDIT_ARTIFACT_DIR: artifacts/reviewed-source-links
      - name: Upload reviewed-source audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-source-links-${{ github.run_id }}
          path: artifacts/reviewed-source-links/
          if-no-files-found: warn
          retention-days: 30

  practical-guide-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Locate Chrome for controlled browser fallback
        shell: bash
        run: |
          for browser in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$browser" >/dev/null 2>&1; then
              echo "CHROME_BIN=$(command -v "$browser")" >> "$GITHUB_ENV"
              "$browser" --version
              exit 0
            fi
          done
          echo "No supported Chrome or Chromium binary is available" >&2
          exit 1
      - name: Audit practical-guide official sources
        run: npm run audit:practical-links
        env:
          PRACTICAL_LINK_AUDIT_ARTIFACT_DIR: artifacts/practical-guide-links
      - name: Upload practical-guide link evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: practical-guide-links-${{ github.run_id }}
          path: artifacts/practical-guide-links/
          if-no-files-found: warn
          retention-days: 30

  practical-guide-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-practical.txt
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install pinned practical-guide dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-practical.txt
      - name: Execute all practical-guide examples
        run: python examples/practical-guides/validate_pilot.py
        env:
          PRACTICAL_EXECUTION_ARTIFACT_DIR: artifacts/practical-guide-execution
      - name: Execute terminal-first parsers and acceptance checks
        run: |
          python scripts/validate-case-schema.py
          node scripts/validate-cases.mjs --execute
        env:
          CASE_PYTHON: python
      - name: Upload practical-guide execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: practical-guide-execution-${{ github.run_id }}
          path: artifacts/practical-guide-execution/
          if-no-files-found: warn
          retention-days: 30

  tool-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Audit tool official resources
        run: npm run audit:tool-links
        env:
          TOOL_LINK_AUDIT_ARTIFACT_DIR: artifacts/tool-links
      - name: Upload tool-link evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool-links-${{ github.run_id }}
          path: artifacts/tool-links/
          if-no-files-found: warn
          retention-days: 30
